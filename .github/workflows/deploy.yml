name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install deps
        run: pip install pyyaml
      - name: build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://glogiotatidis.github.io/mini-blog/' }}
        run: python3 build.py
      - name: commit generated files
        run: |
          if git diff --quiet -- posts.jsonl rss.xml; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.jsonl rss.xml
          git commit -m "rebuild posts.jsonl and rss.xml [skip ci]"
          git push
      - name: configure pages
        uses: actions/configure-pages@v5
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
