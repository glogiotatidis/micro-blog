name: regenerate rss

on:
  push:
    branches: [main]
    paths: [posts.jsonl, gen_rss.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: regenerate
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.com/' }}
        run: python3 gen_rss.py
      - name: commit if changed
        run: |
          if git diff --quiet -- rss.xml; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git commit -m "regenerate rss.xml"
          git push
